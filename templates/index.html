<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diamond Price Predictor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 20px; color: #2c3e50;
  }
  .container { max-width: 1300px; margin: 0 auto; background: #fff; border-radius: 20px;
    overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  header { background: #2c3e50; color: #fff; text-align: center; padding: 34px 20px; }
  header h1 { font-size: 2.4rem; }
  header p { margin-top: 8px; opacity: .9; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    flex-wrap: wrap; padding: 14px 24px; background: #f8f9fa; border-bottom: 1px solid #e5e7eb; font-size: .9rem; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #dc3545; margin-right: 8px; }
  .dot.ok { background: #28a745; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding: 28px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid #eef0f3; border-radius: 16px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
  .card h2 { font-size: 1.35rem; padding-bottom: 12px; border-bottom: 2px solid #3498db; margin-bottom: 22px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
  label { display: block; font-size: .8rem; font-weight: 600; color: #4a5568; margin-bottom: 8px; }
  input, select { width: 100%; padding: 12px; font-size: 1rem; border: 2px solid #e2e8f0; border-radius: 10px; background: #fff; }
  input:focus, select:focus { outline: none; border-color: #3498db; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  button { border: none; border-radius: 10px; padding: 12px 22px; font-weight: 700; font-size: .95rem; cursor: pointer; color: #fff; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .green { background: linear-gradient(135deg, #27ae60, #219a52); }
  .blue { background: linear-gradient(135deg, #3498db, #2980b9); }
  .gray { background: #eee; color: #222; }
  .msg { margin-top: 20px; padding: 14px 16px; border-radius: 10px; font-size: .92rem; display: none; }
  .msg.ok { display: block; background: #e8f7ee; color: #1e6b3a; }
  .msg.err { display: block; background: #fdecea; color: #a12622; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .metric { background: #f8f9fa; border-radius: 10px; padding: 12px 14px; }
  .metric span { display: block; font-size: .78rem; color: #6b7280; }
  .metric b { font-size: 1.05rem; }
  .result { display: none; margin-top: 24px; padding: 22px; border-left: 5px solid #28a745;
    border-radius: 12px; background: linear-gradient(135deg, #f8f9fa, #e9ecef); }
  .result.show { display: block; }
  .result h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .price { text-align: center; font-size: 2.8rem; font-weight: 800; color: #27ae60; margin: 12px 0 20px; }
  .details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .detail { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .detail span { display: block; font-size: .8rem; color: #6b7280; margin-bottom: 4px; }
  .detail b { font-size: 1.1rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>💎 Diamond Price Predictor</h1>
    <p>Advanced Machine Learning Model for Accurate Diamond Valuation</p>
  </header>

  <div class="status-bar">
    <div><span class="dot" id="apiDot"></span><span id="apiText">API Status: Checking...</span></div>
    <div><span class="dot" id="modelDot"></span><span id="modelText">Model: Checking...</span></div>
    <div><b>Server: <span id="serverText"></span></b></div>
  </div>

  <div class="grid">
    <!-- Training card -->
    <section class="card">
      <h2>🔧 Model Training &amp; Status</h2>
      <div class="btns">
        <button class="green" id="trainBtn">🚀 Train Model</button>
        <button class="blue" id="refreshBtn">🔄 Refresh Status</button>
      </div>
      <div class="msg" id="trainMsg"></div>
      <div class="metrics" id="metrics"></div>
    </section>

    <!-- Prediction card -->
    <section class="card">
      <h2>💎 Diamond Price Prediction</h2>
      <div class="row">
        <div><label for="carat">Carat Weight</label><input id="carat" type="number" step="0.01" min="0.01" value="1.0"></div>
        <div><label for="depth">Depth %</label><input id="depth" type="number" step="0.1" min="40" max="80" value="61.5"></div>
        <div><label for="table">Table %</label><input id="table" type="number" step="0.1" min="40" max="80" value="57"></div>
      </div>
      <div class="row">
        <div><label for="cut">Cut Quality</label><select id="cut"><option value="">Select Cut</option></select></div>
        <div><label for="color">Color Grade</label><select id="color"><option value="">Select Color</option></select></div>
        <div><label for="clarity">Clarity Grade</label><select id="clarity"><option value="">Select Clarity</option></select></div>
      </div>
      <div class="row">
        <div><label for="x">Length (mm)</label><input id="x" type="number" step="any" min="0.1" value="6.5"></div>
        <div><label for="y">Width (mm)</label><input id="y" type="number" step="any" min="0.1" value="6.48"></div>
        <div><label for="z">Height (mm)</label><input id="z" type="number" step="any" min="0.1" value="4.0"></div>
      </div>
      <div class="btns">
        <button class="blue" id="predictBtn">🔮 Predict Price</button>
        <button class="gray" id="sampleBtn">📝 Load Sample</button>
      </div>
      <div class="msg" id="predMsg"></div>

      <div class="result" id="result">
        <h3>💰 Predicted Price</h3>
        <div class="price" id="priceValue">$0</div>
        <div class="details">
          <div class="detail"><span>Price per Carat</span><b id="ppc">-</b></div>
          <div class="detail"><span>Volume</span><b id="vol">-</b></div>
          <div class="detail"><span>Price Category</span><b id="pcat">-</b></div>
          <div class="detail"><span>Carat Category</span><b id="ccat">-</b></div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const API = window.location.origin;
$('serverText').textContent = window.location.host;

const money = n => '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
const SAMPLES = [
  { carat: 1.0, cut: 'Ideal', color: 'G', clarity: 'VS2', depth: 61.5, table: 57, x: 6.5, y: 6.48, z: 4.0 },
  { carat: 0.5, cut: 'Premium', color: 'E', clarity: 'VVS1', depth: 62.0, table: 58, x: 5.1, y: 5.1, z: 3.2 },
  { carat: 2.0, cut: 'Good', color: 'J', clarity: 'SI1', depth: 63.0, table: 59, x: 8.0, y: 8.0, z: 5.0 },
];
let sampleIdx = 0;

function show(el, text, ok) { el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); }

function fillOptions(opts) {
  for (const key of ['cut', 'color', 'clarity']) {
    const sel = $(key);
    if (sel.options.length > 1) continue;
    opts[key].forEach(v => sel.add(new Option(v, v)));
  }
}

function renderMetrics(m) {
  if (!m || m.test_r2 === undefined) { $('metrics').innerHTML = ''; return; }
  const items = [
    ['Test R²', m.test_r2.toFixed(4)], ['Test MAE', money(m.test_mae)],
    ['Test RMSE', money(m.test_rmse)], ['Training samples', m.training_samples.toLocaleString()],
  ];
  $('metrics').innerHTML = items.map(([k, v]) => `<div class="metric"><span>${k}</span><b>${v}</b></div>`).join('');
}

async function refreshStatus() {
  try {
    const h = await fetch(API + '/api/health'); if (!h.ok) throw 0;
    $('apiDot').className = 'dot ok'; $('apiText').textContent = 'API Status: Online';
    const s = await (await fetch(API + '/api/status')).json();
    fillOptions(s.options);
    $('modelDot').className = 'dot' + (s.model_loaded ? ' ok' : '');
    $('modelText').textContent = s.model_loaded ? 'Model: Ready' : 'Model: Not trained';
    renderMetrics(s.metrics);
  } catch (e) {
    $('apiDot').className = 'dot'; $('apiText').textContent = 'API Status: Offline';
    $('modelDot').className = 'dot'; $('modelText').textContent = 'Model: Error';
  }
}

$('trainBtn').onclick = async () => {
  const btn = $('trainBtn'); btn.disabled = true; btn.textContent = '⏳ Training...';
  show($('trainMsg'), 'Training the model on 50,000+ diamonds. This takes a minute...', true);
  try {
    const r = await fetch(API + '/api/train', { method: 'POST' });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'Training failed');
    show($('trainMsg'), '✅ Model trained successfully!', true);
    renderMetrics(d.metrics);
  } catch (e) { show($('trainMsg'), '❌ ' + e.message, false); }
  btn.disabled = false; btn.textContent = '🚀 Train Model';
  refreshStatus();
};

$('refreshBtn').onclick = refreshStatus;

$('sampleBtn').onclick = () => {
  const s = SAMPLES[sampleIdx++ % SAMPLES.length];
  for (const k in s) $(k).value = s[k];
};

$('predictBtn').onclick = async () => {
  const body = {};
  for (const k of ['carat', 'cut', 'color', 'clarity', 'depth', 'table', 'x', 'y', 'z']) body[k] = $(k).value;
  if (Object.values(body).some(v => v === '')) { show($('predMsg'), 'Please fill in all fields (including cut, color and clarity).', false); $('result').classList.remove('show'); return; }
  $('predMsg').className = 'msg';
  try {
    const r = await fetch(API + '/api/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    $('priceValue').textContent = money(d.predicted_price);
    $('ppc').textContent = money(d.price_per_carat);
    $('vol').innerHTML = d.volume + ' mm³';
    $('pcat').textContent = d.price_category;
    $('ccat').textContent = d.carat_category;
    $('result').classList.add('show');
  } catch (e) { show($('predMsg'), '❌ ' + e.message, false); $('result').classList.remove('show'); }
};

refreshStatus();
</script>
</body>
</html>
